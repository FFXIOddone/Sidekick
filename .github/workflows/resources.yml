name: resources

on:
  schedule:
    - cron: '17 9 * * 1'   # Mondays 09:17 UTC; off the hour, top-of-hour runs get delayed
  workflow_dispatch:        # "Run workflow" button for a manual regen

permissions:
  contents: write
  pull-requests: write

jobs:
  regen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Only sql/ is read; sparse + shallow keeps the server clone small.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: CatsAndBoats/catseyexi
          ref: base
          path: catseyexi
          sparse-checkout: sql
          persist-credentials: false
      - uses: leafo/gh-actions-lua@6919171ccf181b826f44b9bca76307b577217377 # v13
        with:
          luaVersion: luajit-2.1
      - run: luajit tools/gen_resources.lua catseyexi
      # The header records the server commit, so it changes every run; only real rows count.
      - id: diff
        run: git diff --quiet --ignore-cr-at-eol -I'^-- Generated by' -- tests/data || echo "changed=1" >> "$GITHUB_OUTPUT"
      - if: steps.diff.outputs.changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha=$(git -C catseyexi rev-parse --short=12 HEAD)
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -C auto/resources
          git commit -am "chore: regenerate tests/data from CatsEyeXI $sha"
          git push -f origin auto/resources
          [ "$(gh pr list --head auto/resources --json number -q length)" = 0 ] && gh pr create \
            --head auto/resources --title "Regenerate tests/data from CatsEyeXI" \
            --body "Weekly \`make resources\` against CatsAndBoats/catseyexi@base ($sha). Test result: see the resources workflow run."
      # PRs opened with GITHUB_TOKEN don't trigger ci.yml, so test here. A red run means a job file needs updating.
      - if: steps.diff.outputs.changed
        run: luajit tests/run.lua
